name: Daily Data Update (Test Mode - 10 pairs)

on:
  # Пока отключаем автоматический запуск по расписанию для тестирования
  # schedule:
  #   - cron: '0 5 * * *'
  workflow_dispatch:  # Только ручной запуск

jobs:
  update-raw-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Уменьшаем для тестового режима (10 пар = ~2 минуты + запас)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run incremental update (TEST MODE - 10 random pairs)
      env:
        TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      run: |
        echo "Starting test mode update (10 random pairs)..."
        python scripts/daily_update/incremental_updater.py
        
    - name: Check for changes
      id: check-changes
      run: |
        echo "Checking for updated files..."
        git status
        if git diff --name-only | grep -q "\.csv$"; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "github-actions@github.com"
        git config --local user.name "GitHub Actions"
        git add data/raw/twelve_data/pairs/*.csv
        git add data/metadata/update_state.json
        git commit -m "Auto-update: daily data refresh (test mode - 10 pairs) [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: No changes to commit
      if: steps.check-changes.outputs.has_changes == 'false'
      run: |
        echo "No changes to commit - data is already up to date."